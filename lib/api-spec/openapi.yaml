          description: >-
            True when the spin's recording (or any track from the same primary
            release group) is in the authenticated listener's library. Always
            false for unauthenticated requests.
        isArtistHit:
          type: boolean
          description: >-
            True when the spin's artist is in the listener's library but the
            exact track/album is not. Always false for unauthenticated requests.
      required: [mbid, artistMbid, releaseGroupMbid, title, artist, playedAt, isFirstSpin, isLibraryHit, isArtistHit]
