        slug:
          type: string
        name:
          type: string
        spinCount:
          type: integer
        resolvedCount:
          type: integer
        oldestSpinAt:
          type: ["string", "null"]
        newestSpinAt:
          type: ["string", "null"]
        supportsBackfill:
          type: boolean
        backfillDone:
          type: boolean
        backfillCursor:
          type: ["string", "null"]
          description: Where the backward walk currently stands, when digging.
      required:
        - slug
        - name
        - spinCount
        - resolvedCount
        - oldestSpinAt
        - newestSpinAt
        - supportsBackfill
        - backfillDone
        - backfillCursor
    PickerCoverage:
      type: object
      description: >-
        Archive depth for one picker: documented runs (source-cited groups),
        total picks, and how many resolved to the spine.
      properties:
        handle:
          type: string
        name:
          type: string
        runCount:
          type: integer
        pickCount:
          type: integer
        resolvedCount:
          type: integer
        oldestPickedAt:
          type: ["string", "null"]
        newestPickedAt:
          type: ["string", "null"]
      required:
        - handle
        - name
        - runCount
        - pickCount
        - resolvedCount
        - oldestPickedAt
        - newestPickedAt
    ArchiveCoverage:
      type: object
      properties:
        stations:
          type: array
