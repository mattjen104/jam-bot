          type: string
        homeUrl:
          type: string
      required:
        - labelMbid
    BlogIngestRequest:
      type: object
      description: Ingest a blog/critic RSS feed as a picker.
      properties:
        feedUrl:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        homeUrl:
          type: string
      required:
        - feedUrl
        - name
    DiscogsListRequest:
      type: object
      description: Ingest a public Discogs list as a collector picker.
      properties:
        listId:
          type: string
          minLength: 1
        name:
          type: string
      required:
        - listId
    RymListRequest:
      type: object
