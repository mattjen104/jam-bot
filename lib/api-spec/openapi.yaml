      properties:
        stationSlug:
          type: string
          minLength: 1
        artist:
          type: string
          minLength: 1
        title:
          type: string
          minLength: 1
        citation:
          type: string
          minLength: 1
        playedAt:
          type: string
          description: ISO timestamp; defaults to now when omitted.
        showName:
          type: string
        djName:
          type: string
        durationMs:
          type: integer
      required:
        - stationSlug
        - artist
        - title
        - citation
    ManualSpinResponse:
      type: object
      properties:
        logged:
          type: boolean
        mbid:
          type: ["string", "null"]
        confidence:
          type: string
          enum: [recording_id, isrc, text, unresolved, spotify]
      required:
        - logged
        - confidence
    Picker:
      type: object
      description: A trusted taste source (label, blog, curator, collector, event, DJ).
      properties:
        id:
          type: integer
        pickerType:
          type: string
          enum: [dj, label, blog, curator, collector, event, series, editorial]
        name:
          type: string
        handle:
          type: string
        homeUrl:
          type: ["string", "null"]
        trustTier:
          type: integer
        description:
          type: ["string", "null"]
        active:
