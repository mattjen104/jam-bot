openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: song
    description: Song-context enrichment (graph + dossier)
  - name: stations
    description: Lore — curated radio stations + now-playing resolution
  - name: spotify
    description: >
      Lore — Spotify Connect. Remote-controls the LISTENER'S OWN Spotify app
      via the Web API (no SDK, no audio proxying) so rides can play full
      tracks. Identity is an opaque httpOnly session cookie; browser-navigation
      OAuth endpoints (/spotify/login, /spotify/callback) are deliberately not
      in this spec — they are redirects, not JSON APIs.
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /song/resolve:
    get:
      operationId: resolveSong
      tags: [song]
      summary: Resolve free-text to a Spotify track
      description: >
        Resolves a free-text query (e.g. "kashmir led zeppelin") to a single
        best-match Spotify track, including the public Spotify oEmbed embed HTML
        for the anchor player node.
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Resolved track
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResolvedSong"
        "404":
          description: No match found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Spotify not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /song/{trackId}/context:
    get:
      operationId: getSongContext
      tags: [song]
      summary: Consolidated song-context dossier
      description: >
        Returns the same enrichment the jam-bot Slack track card serves —
        credits/pressing (knowledge), genre/era/bio/links (context), the
        artist's playable catalogue, cross-platform links, and timed insights.
        Every section degrades to null/empty when its source is unconfigured or
        has no data.
      parameters:
        - name: trackId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Song context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SongContext"
        "404":
          description: Track not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /song/oembed:
    get:
      operationId: getOembed
      tags: [song]
      summary: Spotify oEmbed passthrough
      description: >
        Public Spotify oEmbed passthrough for an open.spotify.com URL. Requires
        no Spotify credentials.
      parameters:
        - name: url
          in: query
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: oEmbed payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OEmbed"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /stations:
    get:
      operationId: listStations
      tags: [stations]
      summary: List curated radio stations
      description: >
        The public directory of curated, high-quality radio stations. Each
        station carries its own sanctioned live stream URL (played unmodified),
        a quality badge, and attribution links (homepage + donate).
      responses:
        "200":
          description: Station directory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StationList"
  /stations/artist-frequency:
    get:
      operationId: getStationsArtistFrequency
      tags: [stations]
      summary: Most-played artists across Lore stations
      description: >
        Returns a bounded, deterministic list of artists from resolved spins
        across active, non-hidden Lore stations. Canonical MusicBrainz artist
        identities are grouped by artist MBID, while older recordings without
        an artist MBID are grouped by normalized display name.
      responses:
        "200":
          description: Ranked Lore-wide artist frequency list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StationsArtistFrequencyResult"
  /stations/at/{date}/now-playing:
    get:
      operationId: listStationsAtDate
      tags: [stations]
      summary: Last spin per station for a specific calendar day (ghost dial)
      description: >
        Same as listStationsNowPlaying but for a historical calendar day.
        Returns the last logged spin per station on that UTC date. Powers the
        ghost-dial date sweep on the home page.
      parameters:
        - name: date
          in: path
          required: true
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
          description: Calendar day in YYYY-MM-DD format (UTC).
      responses:
        "200":
          description: Last spin per station on the given day
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StationPulseList"
  /stations/now-playing:
    get:
      operationId: listStationsNowPlaying
      tags: [stations]
      summary: Current track on every station, in one call (dial pulse)
      description: >
        The latest logged spin for each station in the directory — artwork,
        raw title/artist, best-effort recording resolution, and show/DJ
        attribution when the source exposes it. Powers the dial's live album
        covers. Stations with nothing logged yet return a null `nowPlaying`.
      responses:
        "200":
          description: Latest spin per station
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StationPulseList"
  /stations/{slug}/now-playing:
    get:
      operationId: getStationNowPlaying
      tags: [stations]
      summary: Current track on a station, resolved to the MBID spine
      description: >
        The most recent spin logged for a station, resolved (best-effort) to a
        MusicBrainz Recording ID with cross-service deep links and artwork. The
        `nowPlaying` field is null when nothing has been logged yet.
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Station with its current now-playing track
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StationNowPlaying"
        "404":
          description: Station not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /stations/{slug}/report-now-playing:
    post:
      operationId: reportStationNowPlaying
      tags: [stations]
      summary: Client-reported now-playing for stations with no server poller
      description: >
        For longtail stations with no server-side now-playing source (e.g. a
        RadioBrowser station), the browser can discover the current track from
        the station's own Icecast status endpoint and report it here. The
        track is resolved through the same MusicBrainz/Spotify pipeline as any
        server-polled spin and then appears in now-playing, the journal, and
        the archive like a normal spin. Deduped against the last logged spin
        for the station, so it is safe to call repeatedly (e.g. every 30s)
        while the same track is playing.
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IcecastReport"
      responses:
        "200":
          description: Report processed (logged reflects whether a new spin was written)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IcecastReportResult"
        "400":
          description: Invalid report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Station not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /recordings/{mbid}:
    get:
      operationId: getRecording
      tags: [recordings]
      summary: A recording's own metadata (song-page header)
      description: >
        The MBID-keyed recording node — title, artist, artwork and cross-service
        deep links — for rendering a shareable song page. 404 when the MBID is
        not (yet) on the spine.
      parameters:
        - name: mbid
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: The recording node
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordingNode"
        "404":
          description: Recording not on the spine
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /recordings/availability:
    get:
      operationId: getRecordingsAvailability
      tags: [recordings]
      summary: Batch check for lyrics and Song Exploder content
      description: >
        Given a comma-separated list of recording MBIDs, returns which ones have
        synced lyrics and/or a linked Song Exploder episode. Used by the home
        page to show content-indicator badges. Caps at 100 MBIDs per call.
      parameters:
        - name: mbids
          in: query
          required: true
          schema:
            type: string
          description: Comma-separated recording MBIDs (max 100).
      responses:
        "200":
          description: Availability flags per MBID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordingsAvailabilityResult"
  /recordings/{mbid}/knowledge:
    get:
      operationId: getRecordingKnowledge
      tags: [recordings]
      summary: Liner-notes knowledge for a recording (credits, pressing)
      description: >
        Real liner-notes enrichment for a recording on the spine — personnel
        credits, original pressing detail, and typed song relationships —
        resolved from MusicBrainz/Discogs and cached. `knowledge` is null when
        the sources are unconfigured or nothing verifiable was found; Lore
        never fabricates credits.
      parameters:
        - name: mbid
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: The recording's liner-notes knowledge (or null)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordingKnowledge"
        "404":
          description: Recording not on the spine
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /recordings/{mbid}/spins:
    get:
      operationId: getRecordingSpins
      tags: [recordings]
      summary: Where a recording has been played, with attribution
      description: >
        Every logged spin of a recording (newest first), each attributed to the
        station and — when the source exposes it — the show and DJ. This is the
        play-history surface for a track page.
      parameters:
        - name: mbid
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: The recording's spins
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordingSpins"
  /recordings/{mbid}/picks:
    get:
      operationId: getRecordingPicks
      tags: [recordings]
      summary: Curated lists that contain a recording ("Picked by")
      description: >
        Every curated pick of this recording — the reverse edge of the
        song–source graph. Each pick carries its picker, the specific list/run
        it belongs to (runId, when the pick has a source URL), its ordinal
        within that list, and the run's size, so a song page can link both to
        the picker and to the exact list, and offer "hear it in context"
        playback. Only real human selection edges — never inferred.
      parameters:
        - name: mbid
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: The recording's curated picks (empty when none)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordingPicks"
  /recordings/{mbid}/preview:
    get:
      operationId: getRecordingPreview
      tags: [recordings]
      summary: A 30-second preview clip for a recording (for riding)
      description: >
        Best-effort 30s preview resolved via the public iTunes Search API and
        streamed directly from Apple's CDN to the client (Lore never hosts or
        proxies the audio bytes). previewUrl is null when none was found; the UI
        then degrades to deep links.
      parameters:
        - name: mbid
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: The recording's preview (fields may be null)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordingPreview"
        "404":
          description: Recording not on the spine
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /recordings/{mbid}/album-tracks:
    get:
      operationId: getRecordingAlbumTracks
      tags: [recordings]
      summary: All tracks in the same album as this recording
      parameters:
        - name: mbid
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Album track list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlbumTracksResponse"
        "404":
          description: No album found for this recording
  /recordings/{mbid}/list-provenance:
    get:
      operationId: getRecordingListProvenance
      tags: [recordings]
      summary: Publication list appearances for a recording
      description: >
        Returns year-end / all-time list entries from music publications that
        feature the primary album this recording appears on. Ordered by rank
        (ascending), then by list year (descending). Only confirmed or
        exact-confidence entries are returned. Returns an empty array when no
        list provenance has been scraped yet.
      parameters:
        - name: mbid
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: List provenance items (may be empty)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordingListProvenanceResponse"
  /recordings/{mbid}/segues:
    get:
      operationId: getRecordingSegues
      tags: [recordings]
      summary: Songs observed playing next (Segue mode)
      description: >
        Real DJ transitions observed after this recording, ranked by a
        station-class-weighted frequency so curated/community segues outrank
        commercial ones. Powers Segue mode.
      parameters:
        - name: mbid
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Ranked next-song candidates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SegueNextList"
  /admin/spins:
    post:
      operationId: createManualSpin
      tags: [admin]
      summary: Admin-only manual/historical spin entry
      description: >
        Log a spin by hand for historical reconstruction, resolved to the MBID
        spine and stored with source="manual" and a required citation. Guarded
        by the `x-admin-token` header matching the LORE_ADMIN_TOKEN env var;
        returns 503 when the admin token is not configured.
      parameters:
        - name: x-admin-token
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManualSpinRequest"
      responses:
        "201":
          description: The spin was logged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManualSpinResponse"
        "400":
          description: Invalid manual spin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Missing or invalid admin token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Station not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Admin entry not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /pickers:
    get:
      operationId: listPickers
      tags: [pickers]
      summary: All active pickers (labels, blogs, curators, collectors, events)
      description: >
        The trusted taste sources Lore rides beyond radio DJs. A DJ is one
        picker type; this lists the rest (and any DJ-typed pickers), so a client
        can browse who is doing the picking. Filter by pickerType with the
        optional `type` query parameter.
      parameters:
        - name: type
          in: query
          required: false
          description: Filter to a specific pickerType (e.g. "editorial").
          schema:
            type: string
      responses:
        "200":
          description: The active pickers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PickerList"
  /stations/{slug}/archive:
    get:
      operationId: getStationArchive
      tags: [archive]
      summary: A station's documented runs (ghost radio browse surface)
      description: >
        The station's play history grouped into runs — one run per show per UTC
        broadcast day — newest first. Each run is a real, documented sequence a
        DJ actually aired; the `runId` is an opaque id for fetching the full
        tracklist via /archive/station-runs/{runId}.
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: The station's archived runs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StationArchive"
        "404":
          description: Station not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /stations/{slug}/insights:
    get:
      operationId: getStationInsights
      tags: [archive]
      summary: Genre breakdown + discovery score for a station
      description: >
        Aggregated genre tags and a discovery score (recent-release-leaning
        vs. catalog-leaning) across the station's logged spin history.
        Served from the station's persisted `genreProfile`/`discoveryScore`
        columns (recomputed periodically by the insights job); when served
        from the cache, `medianAgeYears` is null and `sampleSize`/
        `unknownCount` are 0. A station the job has never scored falls back
        to a live aggregation over already-enriched recording data. Degrades
        to unknown/null fields when there isn't enough enriched data yet.
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: The station's genre + discovery insights
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StationInsights"
        "404":
          description: Station not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /stations/spins:
    get:
      operationId: getStationSpins
      tags: [archive]
      summary: A station's full logged spin history, scrubbed by time
      description: >
        Paginated, time-ordered (newest first) spin history for a station —
        every logged play, independent of show/run grouping. Powers the
        universal scrub timeline so listeners can browse a longtail station's
        history even when it has no documented "runs". Pass `before` (an ISO
        timestamp) to page further into the past; omit it for the most recent
        page. `bounds` reports the full time range covered so a client can
        render a continuous scrub control.
      parameters:
        - name: slug
          in: query
          required: true
          schema:
            type: string
            minLength: 1
        - name: before
          in: query
          required: false
          description: Only return spins played strictly before this ISO timestamp.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Max spins to return (default 50, max 200).
          schema:
            type: integer
      responses:
        "200":
          description: A page of the station's spin history, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StationSpinsPage"
        "404":
          description: Station not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /archive/station-runs/{runId}:
    get:
      operationId: getStationRun
      tags: [archive]
      summary: One archived station run, in airing order
      description: >
        The full tracklist of one documented station run (a show's UTC broadcast
        day), oldest first — exactly as it aired. Tracks resolved to the spine
        carry their recording node; unresolved tracks keep raw metadata so the
        honesty gradient stays visible.
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The run with its ordered tracks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StationRunDetail"
        "404":
          description: Run not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /replay/{id}:
    get:
      operationId: getReplayManifest
      tags: [archive]
      summary: Resolve a canonical Ghost Replay manifest
      description: >
        Returns the server-derived reconstruction of one archived station run.
        The replay id is the smallest spin id in the station/show/UTC-day
        partition. Every spin remains in broadcast order, including unresolved
        rows whose recording is null; source spin ids and timestamps are
        preserved for honest replay and Keep provenance.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Canonical Ghost Replay manifest
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplayManifest"
        "404":
          description: Replay not found, hidden, or empty
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /replay/{id}/guided-queue:
    get:
      operationId: getGuidedReplayQueue
      tags: [archive]
      summary: Build an ordered native-app link-out queue for a replay
      description: >
        Returns one service's safe native/web targets in the replay manifest's
        original order. Missing and unresolved rows remain in the response with
        an explicit reason; this endpoint never changes the manifest or player.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
        - name: service
          in: query
          required: false
          schema:
            type: string
          description: Service key, such as spotify or youtube_music. Defaults to the first mapped service.
      responses:
        "200":
          description: Ordered guided queue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuidedReplayQueue"
        "404":
          description: Replay not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /replay/{id}/playlist-targets:
    get:
      operationId: getReplayPlaylistTargets
      tags: [archive]
      summary: List configured Ghost Replay playlist destinations
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Target capabilities and authorization state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplayPlaylistTargetsResponse"
        "401":
          description: Listener session required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /replay/{id}/materialize:
    post:
      operationId: startReplayPlaylistMaterialization
      tags: [archive]
      summary: Create a user-requested Apple Music or Tidal replay playlist
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplayMaterializationRequest"
      responses:
        "202":
          description: Playlist materialization job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplayMaterializationJob"
        "400":
          description: Service unavailable, unconfigured, or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /replay/materialization-jobs/{jobId}:
    get:
      operationId: getReplayPlaylistMaterialization
      tags: [archive]
      summary: Read a persisted replay playlist receipt
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Playlist materialization progress or terminal receipt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplayMaterializationJob"
        "404":
          description: Job not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /replay/{id}/apple-music:
    get:
      operationId: getAppleMusicReplayMaterialization
      tags: [archive]
      summary: Apple MusicKit configuration and replay coverage
      description: >
        Returns a read-only Apple Music materialization receipt in the replay's
        original broadcast order. The developer token is short-lived and is
        safe for MusicKit JS to receive; the signing key is never sent to the
        browser. Unresolved, unavailable, and dead mappings remain explicit.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Apple Music materialization receipt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppleMusicReplayMaterialization"
        "404":
          description: Replay not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /archive/station-runs/{runId}/insights:
    get:
      operationId: getStationRunInsights
      tags: [archive]
      summary: Genre breakdown + discovery score for one station run (show)
      description: >
        Aggregated genre tags and a discovery score across a single archived
        station run's tracklist. Computed on read from already-enriched
        recording data. Degrades to unknown/null fields when there isn't
        enough enriched data yet.
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The run's genre + discovery insights
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StationRunInsights"
        "404":
          description: Run not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /archive/picker-runs/{runId}/insights:
    get:
      operationId: getPickerRunInsights
      tags: [archive]
      summary: Genre breakdown + discovery score for one picker run (list)
      description: >
        Aggregated genre tags and a discovery score across a single archived
        picker run's tracklist (a curated list or episode). Computed on read
        from already-enriched recording data. Degrades to unknown/null fields
        when there isn't enough enriched data yet.
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The run's genre + discovery insights
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PickerRunInsights"
        "404":
          description: Run not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /pickers/{handle}/archive:
    get:
      operationId: getPickerArchive
      tags: [archive]
      summary: A picker's documented runs (archived episodes / lists)
      description: >
        The picker's picks grouped into runs — one run per source URL (an NTS
        episode page, a list, a post) — newest first by pick date. The `runId`
        is an opaque id for fetching the ordered tracklist via
        /archive/picker-runs/{runId}.
      parameters:
        - name: handle
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: The picker's archived runs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PickerArchive"
        "404":
          description: Picker not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /pickers/{handle}/insights:
    get:
      operationId: getPickerInsights
      tags: [archive]
      summary: Genre breakdown + discovery score across a picker's full pick history
      description: >
        Aggregated genre tags and a discovery score (recent-release-leaning
        vs. catalog-leaning) across every pick this picker has logged, for
        curated-list pickers (labels, blogs, curators, etc.) that have no
        per-run aggregate elsewhere. Computed on read from already-enriched
        recording data — never a per-pick recompute. Degrades to
        unknown/null fields when there isn't enough enriched data yet.
      parameters:
        - name: handle
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: The picker's genre + discovery insights
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PickerInsights"
        "404":
          description: Picker not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /archive/picker-runs/{runId}:
    get:
      operationId: getPickerRun
      tags: [archive]
      summary: One archived picker run, in documented order
      description: >
        The ordered tracklist of one picker run (an archived episode or list),
        in the order the picker documented it. Ordinals are preserved; tracks
        resolved to the spine carry their recording node.
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The run with its ordered tracks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PickerRunDetail"
        "404":
          description: Run not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /archive/coverage:
    get:
      operationId: getArchiveCoverage
      tags: [archive]
      summary: How deep the ghost radio archive goes, per source
      description: >
        Observability for the archive: per-station depth (oldest documented
        spin, backfill progress) and per-picker run counts, each with resolved
        vs. total track counts so "how good is ghost radio" is answerable at
        a glance.
      responses:
        "200":
          description: Per-source archive depth and resolution quality
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArchiveCoverage"
  /archive/recent-runs:
    get:
      operationId: getArchiveRecentRuns
      tags: [archive]
      summary: Recent documented runs across every station (ghost radio browse)
      description: >
        The newest documented runs from all stations in one list — each a real
        show's plays on one UTC broadcast day. Ranked by recency and quality:
        newest broadcast day first, best-resolved runs first within a day, so
        replayable runs lead. Powers the home screen's Ghost Radio mode.
        Supports cursor-based pagination via `before` (the runId of the last
        item on the previous page). When omitted, returns the first page.
      parameters:
        - name: before
          in: query
          required: false
          schema:
            type: string
          description: >
            Opaque pagination cursor. Omit for the first page; pass the
            `nextCursor` value from the previous response to fetch the next
            page. An invalid value returns 400.
      responses:
        "200":
          description: Recent runs across all stations, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArchiveRecentRuns"
  /archive/artist-runs:
    get:
      operationId: searchArtistRuns
      tags: [archive]
      summary: Find archived runs that include an artist
      description: >
        Case-insensitive artist-name search across the whole archive. Matches
        both raw spin/pick metadata and resolved recording artists, then groups
        the hits into their documented runs — station runs (show + UTC
        broadcast day) and picker runs (source-cited lists) — each with a count
        of matching tracks. Powers "which shows/lists played X?".
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
          description: Artist name (or fragment) to search for.
      responses:
        "200":
          description: Runs that include the searched artist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtistRunSearch"
        "400":
          description: Missing or empty search query
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /scraped-shows:
    get:
      operationId: getAllScrapedShows
      tags: [stations]
      summary: All stations with their scraped weekly programming grids
      description: >
        Returns every station that has a scraped weekly schedule, deduplicated
        by fingerprint (same show set = same station), sorted by station name.
        Powers the schedule calendar and the in-progress show detection on
        station cards.
      responses:
        "200":
          description: All stations with their scraped weekly show grids
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScrapedStationList"
  /artist/{mbid}:
    get:
      operationId: getArtist
      tags: [recordings]
      summary: Artist page — Lore top tracks and optional Spotify catalogue
      description: >
        Resolves the artist name from any recording carrying the given artist
        MBID, returns their most-spun recordings on Lore (capped at 20), and
        optionally fetches a Spotify catalogue (top tracks + albums) when
        Spotify is configured.
      parameters:
        - name: mbid
          in: path
          required: true
          schema:
            type: string
            minLength: 1
          description: MusicBrainz artist MBID.
      responses:
        "200":
          description: Artist page data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtistResult"
        "404":
          description: No recordings found for this artist MBID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /album/{releaseGroupMbid}:
    get:
      operationId: getAlbum
      tags: [recordings]
      summary: Album page — tracks cross-referenced with Lore spin data
      description: >
        Returns an album (release group) by its MusicBrainz release group MBID
        with its tracks cross-referenced against Lore spin history. Includes
        spin counts and last-spun timestamps per track. 404 when the release
        group has no spin history on Lore.
      parameters:
        - name: releaseGroupMbid
          in: path
          required: true
          schema:
            type: string
            minLength: 1
          description: MusicBrainz release group MBID.
      responses:
        "200":
          description: Album data with Lore spin cross-reference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlbumResult"
        "404":
          description: No spin data found for this album
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /album/{releaseGroupMbid}/list-provenance:
    get:
      operationId: getReleaseGroupListProvenance
      tags: [recordings]
      summary: Publication list appearances for an album
      description: >
        Returns year-end / all-time list entries from music publications that
        feature this release group. Ordered by rank (ascending), then by list
        year (descending). Only confirmed or exact-confidence entries are
        returned. Returns an empty array when no list provenance has been
        scraped yet.
      parameters:
        - name: releaseGroupMbid
          in: path
          required: true
          schema:
            type: string
            minLength: 1
          description: MusicBrainz release group MBID.
      responses:
        "200":
          description: List provenance items (may be empty)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordingListProvenanceResponse"
  /stations/{slug}/upcoming-schedule:
    get:
      operationId: getStationUpcomingSchedule
      tags: [stations]
      summary: A station's scraped weekly programming grid
      description: >
        The station's own published upcoming-show schedule — show name, day of
        week, start/end time, and DJ when stated — scraped from its homepage
        or a linked schedule page and extracted via LLM. Distinct from
        `/stations/schedule`, which derives a timeline from already-logged
        spins; this reflects what the station itself publishes about shows to
        come. Returns an empty `shows` array (never fabricated entries) when
        the station has no parseable schedule, along with `lastScrapedAt` so
        clients can show "no schedule available" honestly.
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: The station's scraped upcoming schedule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StationUpcomingSchedule"
        "404":
          description: Station not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /djs/{name}:
    get:
      operationId: getDjShows
      tags: [stations]
      summary: All scraped upcoming shows for a DJ across stations
      description: >
        Returns every scraped weekly show slot attributed to the given DJ name
        across all stations. DJ names come from the schedule scraper's
        structured extraction; matching is exact (case-sensitive). Returns 404
        when the name has no scraped shows.
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: DJ's scraped show schedule across stations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DjShows"
        "404":
          description: DJ not found or no scraped shows for this name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/stations/rolling-genres:
    get:
      operationId: getStationsRollingGenres
      tags: [stations]
      summary: Rolling per-song genre chips for the schedule page
      description: >
        Returns up to 3 most-recently-played distinct songs (by MBID) per
        station that have genre data, ordered newest first. Each chip carries
        the recording's primary genre tag and a discovery tier derived inline
        from `recordings.release_year` (≤3yr → "new-music", ≤10yr → "recent",
        older → "catalog", null year → null). Cached server-side for 2 minutes.
      responses:
        "200":
          description: Rolling genre chips keyed by station slug
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StationsRollingGenresResult"
  /stations/recent-spins:
    get:
      operationId: getStationsRecentSpins
      tags: [stations]
      summary: Last 8 spins per station for a given calendar day
      description: >
        Returns the 8 most-recently-played distinct tracks per station for the
        given UTC calendar day, ordered newest first. Deduplicated by MBID when
        resolved, otherwise by title+artist. Powers track-chip timelines on
        showless station cards.
      parameters:
        - name: date
          in: query
          required: true
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
          description: Calendar day in YYYY-MM-DD format (UTC).
      responses:
        "200":
          description: Per-station recent spins for the given day
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StationsRecentSpinsResult"
        "400":
          description: Missing or invalid date parameter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /stations/schedule:
    get:
      operationId: getStationsSchedule
      tags: [stations]
      summary: Show-run timeline for all stations on a given calendar day
      description: >
        Returns all spin-runs (grouped by station, day, and show) for every
        station on the given UTC calendar day, ordered chronologically within
        each station. Powers the show timeline on station cards on the home
        schedule page.
      parameters:
        - name: date
          in: query
          required: true
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
          description: Calendar day in YYYY-MM-DD format (UTC).
      responses:
        "200":
          description: Per-station schedule runs for the given day
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StationsScheduleResult"
        "400":
          description: Missing or invalid date parameter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /stations/{slug}/overlaps/pickers:
    get:
      operationId: getStationPickerOverlaps
      tags: [archive]
      summary: Curated pickers sharing tracks with a station ("Critics agree")
      description: >
        Pickers whose curated lists contain recordings this station has
        actually spun — exact MBID overlap only, never similarity. Ranked by
        the number of distinct shared recordings. Empty when no picker shares
        a track with the station's spin history.
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Pickers overlapping this station's spin history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StationPickerOverlaps"
        "404":
          description: Station not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /pickers/dial:
    get:
      operationId: getPickersDial
      tags: [pickers]
      summary: Curated picker dial with preview tracks
      description: >
        Returns all active pickers with their most-recently-added list run and
        up to 5 preview tracks (artwork + mbid). Powers the curated dial on the
        home page. Fetched once per session; no polling.
      responses:
        "200":
          description: Full curated picker dial
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PickersDialResult"
  /pickers/{handle}/overlaps/stations:
    get:
      operationId: getPickerStationOverlaps
      tags: [archive]
      summary: Stations that have spun a picker's tracks ("On the radio too")
      description: >
        Stations whose logged spin history contains recordings this picker has
        picked — exact MBID overlap only, never similarity. Ranked by the
        number of distinct shared recordings. Empty when radio hasn't touched
        any of the picker's tracks.
      parameters:
        - name: handle
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Stations overlapping this picker's picks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PickerStationOverlaps"
        "404":
          description: Picker not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /selectors:
    get:
      operationId: listSelectors
      tags: [pickers]
      summary: Active DJ selectors with 30-day spin counts
      description: >
        Lists all active DJ-type pickers regardless of station, ordered
        alphabetically. Each entry includes a 30-day spin count, last-played
        timestamp, and station/show attribution so the UI can filter by station
        and surface the most active DJs.
      responses:
        "200":
          description: Active KEXP DJ selectors
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SelectorList"
  /selectors/{handle}/runs:
    get:
      operationId: getSelectorRuns
      tags: [pickers]
      summary: Station-style runs for a KEXP DJ selector
      description: >
        Returns the selector's spin history grouped into runs — one run per
        show × UTC broadcast day — newest first (limit 100). Only resolves
        for KEXP DJ selectors (source_ref.stationSlug='kexp'); non-KEXP or
        non-DJ handles return 404.
      parameters:
        - name: handle
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: The selector's archived runs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SelectorRunsResponse"
        "404":
          description: Selector not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /selectors/{handle}/insights:
    get:
      operationId: getSelectorInsights
      tags: [pickers]
      summary: Genre breakdown + discovery score for a KEXP DJ selector
      description: >
        Aggregated genre tags and a discovery score (recent-release-leaning
        vs. catalog-leaning) across the selector's logged spin history.
        Computed on read from already-enriched recording data — never a
        per-spin recompute. Degrades to unknown/null fields when there isn't
        enough enriched data yet.
      parameters:
        - name: handle
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: The selector's genre + discovery insights
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SelectorInsights"
        "404":
          description: Selector not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /picks/contains:
    get:
      operationId: lookupPickedMbids
      tags: [pickers]
      summary: Which of these MBIDs appear in an editorial list (dial badges)
      description: >
        Batched, cached lookup for the live dial: given a comma-separated list
        of recording MBIDs, returns — for each MBID that appears in at least
        one curated (non-DJ) picker's list — the strongest such pick with its
        picker and list runId. MBIDs with no editorial pick are simply absent.
        Served from an in-memory cache so it never slows the dial poll.
      parameters:
        - name: mbids
          in: query
          required: true
          description: Comma-separated recording MBIDs (max 30 per call).
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Editorial-list hits for the requested MBIDs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PickedLookup"
  /recordings/{mbid}/lyrics:
    get:
      operationId: getRecordingLyrics
      tags: [recordings]
      summary: Synced lyric lines for a recording (LRCLIB)
      description: >
        Returns time-indexed lyric lines from LRCLIB. Each line carries an
        offset_ms so the UI can highlight the active cue during playback.
        Returns an empty lines array when LRCLIB has no synced version.
        Fetched and cached on first request — subsequent calls are instant.
      parameters:
        - name: mbid
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Synced lyric lines (empty when unavailable)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordingLyrics"
        "404":
          description: Recording not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /recordings/{mbid}/entry:
    get:
      operationId: getRecordingEntry
      tags: [recordings]
      summary: Strongest human attribution for a track (entry-flow ladder)
      description: >
        Source-agnostic fallback ladder. Returns the strongest available human
        attribution for a recording — DJ spin, then label, then blog/curator,
        then collector/event, then artist-level — and stops there. Lore never
        falls through to algorithmic similar-tracks: when no human has picked the
        track it returns an empty rung with a "be the first" invitation.
      parameters:
        - name: mbid
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: The strongest rung of attribution found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntryResult"
  /admin/pickers:
    post:
      operationId: upsertPicker
      tags: [admin]
      summary: Admin-only create/update of a picker
      description: >
        Create or update a picker (label, blog, curator, collector, event),
        idempotent by handle. Guarded by the `x-admin-token` header matching the
        LORE_ADMIN_TOKEN env var; returns 503 when unconfigured.
      parameters:
        - name: x-admin-token
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertPickerRequest"
      responses:
        "201":
          description: The picker
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Picker"
        "400":
          description: Invalid picker
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Missing or invalid admin token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Admin entry not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /admin/pickers/{handle}/picks:
    post:
      operationId: logTracklist
      tags: [admin]
      summary: Admin-only tracklist ingest for a picker (curator lists, lineups)
      description: >
        Log a whole tracklist against an existing picker — the generic write path
        behind curator lists and event lineups. Ordered lists form rideable
        edges; unordered lists are ridden as a set. Every entry is logged even
        when it resolves only approximately. Token-guarded.
      parameters:
        - name: handle
          in: path
          required: true
          schema:
            type: string
            minLength: 1
        - name: x-admin-token
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TracklistRequest"
      responses:
        "201":
          description: Ingest summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TracklistResult"
        "400":
          description: Invalid tracklist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Missing or invalid admin token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Picker not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Admin entry not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /admin/labels:
    post:
      operationId: seedLabel
      tags: [admin]
      summary: Admin-only label seed by MusicBrainz MBID
      description: >
        Create a label picker and log a pick for every recording MusicBrainz
        reports on the label's releases (recording-id confidence, no text
        resolution). One MusicBrainz request, honoring the 1 req/sec budget.
        Token-guarded.
      parameters:
        - name: x-admin-token
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LabelSeedRequest"
      responses:
        "201":
          description: Ingest summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestResult"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Missing or invalid admin token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Admin entry not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /admin/blogs:
    post:
      operationId: ingestBlog
      tags: [admin]
      summary: Admin-only blog/critic RSS ingest
      description: >
        Poll a tastemaker RSS/Atom feed and log a pick per post that yields a
        confident artist/track match. Only the resolved pick and a link to the
        exact post are stored — never the post body. Posts with no confident
        match are skipped. Token-guarded.
      parameters:
        - name: x-admin-token
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlogIngestRequest"
      responses:
        "201":
          description: Ingest summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestResult"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Missing or invalid admin token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Admin entry not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /admin/discogs-lists:
    post:
      operationId: ingestDiscogsList
      tags: [admin]
      summary: Admin-only Discogs list ingest (collector)
      description: >
        Ingest a public Discogs list via the Discogs API and log a pick per
        catalogued item, resolving "Artist - Title" where possible and logging
        unresolved otherwise. Token-guarded.
      parameters:
        - name: x-admin-token
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiscogsListRequest"
      responses:
        "201":
          description: Ingest summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestResult"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Missing or invalid admin token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Admin entry not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /admin/rym-lists:
    post:
      operationId: addRymList
      tags: [admin]
      summary: Admin-only RateYourMusic link-out picker
      description: >
        Register a RateYourMusic list as a link-out-only picker. RYM forbids
        scraping, so no items are ingested — only the picker and its home link
        are stored, so the entry flow can point listeners at it without touching
        RYM. Token-guarded.
      parameters:
        - name: x-admin-token
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RymListRequest"
      responses:
        "201":
          description: The picker
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Picker"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Missing or invalid admin token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Admin entry not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /admin/song-exploder/episodes:
    get:
      operationId: listSongExploderEpisodes
      tags: [admin]
      summary: List all Song Exploder episodes with resolution status
      description: >
        Returns the full list of scraped Song Exploder episodes, sorted newest
        first, with their MBID resolution status and anchor count. Used by the
        admin episode review page.
      responses:
        "200":
          description: All episodes with resolution status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SongExploderEpisodeListResult"
  /admin/song-exploder/{episodeId}/claims:
    post:
      operationId: addSongExploderClaim
      tags: [admin]
      summary: Admin-only timestamp-anchored claim entry for a Song Exploder episode
      description: >
        Attach a paraphrased, timestamp-anchored claim to the recording
        resolved from a Song Exploder episode. Claims are admin-entered (never
        automated) because Song Exploder episode timestamps live in the audio,
        not the RSS feed text. The claim is stored as a track_claim with
        source attribution deep-linking to the episode, so every fact is one
        tap from its evidence. Token-guarded.
      parameters:
        - name: episodeId
          in: path
          required: true
          schema:
            type: integer
        - name: x-admin-token
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SongExploderClaimRequest"
      responses:
        "201":
          description: The claim was stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SongExploderClaimResponse"
        "400":
          description: Invalid claim body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Missing or invalid admin token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Episode not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Episode not yet resolved to a recording
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Admin entry not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /admin/claims:
    get:
      operationId: listAllDraftClaims
      tags: [admin]
      summary: All pending Wikipedia draft claims across all tracks
      description: >
        Returns every track claim with status='draft' and
        source_handle='wikipedia' or 'wikipedia-album', ordered by created_at
        desc. Includes a joined track title when the recording is known.
        Token-guarded.
      parameters:
        - name: x-admin-token
          in: header
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: ["draft"]
      responses:
        "200":
          description: All draft claims
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AllDraftClaimsList"
        "401":
          description: Missing or invalid admin token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Admin entry not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /admin/wikipedia-drafts:
    get:
      operationId: getWikipediaDrafts
      tags: [admin]
      summary: Pending Wikipedia section draft claims for a recording
      description: >
        Returns all draft track claims with source_handle='wikipedia' for the
        given recording MBID. The admin reads the linked Wikipedia section, then
        uses PATCH /admin/claims/:id to paraphrase and publish or reject each
        draft. Token-guarded.
      parameters:
        - name: x-admin-token
          in: header
          required: false
          schema:
            type: string
        - name: mbid
          in: query
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Pending draft claims for this recording
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WikipediaDraftList"
        "400":
          description: Missing mbid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Missing or invalid admin token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Admin entry not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /admin/genius-drafts:
    get:
      operationId: listGeniusDrafts
      tags: [admin]
      summary: Admin-only list of pending Genius annotation drafts for a recording
      description: >
        Returns all Genius annotation drafts in 'draft' status for a given
        recording MBID. Each draft carries a normalized-fragment SHA-256
        receipt and character length, a projected timestamp anchor (when a
        matching LRCLIB line was found), and a Genius deep link. Raw
        third-party lyric text is never returned. Admin reviews these and calls
        `/admin/genius-drafts/{id}/review` to publish or reject. Token-guarded.
      parameters:
        - name: x-admin-token
          in: header
          required: false
          schema:
            type: string
        - name: mbid
          in: query
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Pending drafts for the recording
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeniusDraftList"
        "401":
          description: Missing or invalid admin token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Admin entry not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /admin/claims/{id}:
    patch:
      operationId: patchClaim
      tags: [admin]
      summary: Admin review — paraphrase and publish or reject a draft claim
      description: >
        Set the status of a draft track claim to 'published' or 'rejected'. When
        publishing, `text` is required and must be the admin-written paraphrase
        of the Wikipedia section's key fact — never verbatim Wikipedia prose.
        Token-guarded.
      parameters:
        - name: x-admin-token
          in: header
          required: false
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchClaimRequest"
      responses:
        "200":
          description: The updated claim
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WikipediaDraftClaim"
        "400":
          description: Invalid request (e.g. missing text when publishing)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Missing or invalid admin token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Claim not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Admin entry not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /admin/genius-drafts/{id}/review:
    post:
      operationId: reviewGeniusDraft
      tags: [admin]
      summary: Admin-only publish or reject a Genius annotation draft
      description: >
        Publish or reject a pending Genius annotation draft. On publish,
        the admin supplies a paraphrase (`text` field) — never the verbatim
        Genius annotation — which is stored as a `track_claim` with
        `source_label = "Genius"` (or `"Genius · Verified"` for artist-verified
        annotations). The claim inherits the draft's `offset_ms` as
        `position_ms` when `anchor_type = 'timestamp'`. Token-guarded.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: x-admin-token
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GeniusDraftReviewRequest"
      responses:
        "200":
          description: Review result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeniusDraftReviewResponse"
        "400":
          description: Invalid request or draft not in reviewable state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Missing or invalid admin token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Draft not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Admin entry not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /admin/stations:
    get:
      operationId: listAdminStations
      tags: [admin]
      summary: Admin-only station list with ingest quality scores
      description: >
        Full station directory joined with the latest quality scores from the
        station_quality table. One row per station; quality fields are null for
        stations that have not been scored yet. Guarded by the `x-admin-token`
        header matching the LORE_ADMIN_TOKEN env var.
      parameters:
        - name: x-admin-token
          in: header
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Station directory with quality scores
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStationListResponse"
        "401":
          description: Missing or invalid admin token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Admin entry not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /admin/scraped-shows/{id}/void:
    patch:
      operationId: voidScrapedShow
      tags: [admin]
      summary: Withdraw one scraped schedule block
      description: >
        Records an administrative withdrawal for one scraped schedule block.
        The source evidence is retained with voidedAt and voidReason, but the
        block is excluded from schedule-derived show and spin attribution.
        Guarded by the x-admin-token header.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
        - name: x-admin-token
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VoidScrapedShowRequest"
      responses:
        "200":
          description: The retained schedule block and recorded withdrawal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoidScrapedShowResponse"
        "400":
          description: Invalid id or missing reason
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Missing or invalid admin token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Schedule block not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Admin entry not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /admin/stations/recompute-quality:
    post:
      operationId: recomputeStationQuality
      tags: [admin]
      summary: Admin-only on-demand station quality recompute
      description: >
        Triggers an immediate full recompute of quality scores for all active
        stations — the same job the nightly scheduler runs. Returns a flat
        tier count summary (keys = tier names, values = station counts).
        Token-guarded.
      parameters:
        - name: x-admin-token
          in: header
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Recompute complete — tier count summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecomputeQualityResponse"
        "401":
          description: Missing or invalid admin token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Admin entry not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /spotify/status:
    get:
      operationId: getSpotifyStatus
      tags: [spotify]
      summary: Whether this browser session has Spotify connected
      description: >
        `configured` is false when the server has no Spotify app credentials
        (feature honestly absent). `connected` is true when this session's
        cookie maps to stored OAuth tokens.
      responses:
        "200":
          description: Connection status for this session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpotifyStatus"
  /spotify/logout:
    post:
      operationId: spotifyLogout
      tags: [spotify]
      summary: Disconnect Spotify (delete stored tokens, clear cookie)
      responses:
        "204":
          description: Disconnected (idempotent)
  /spotify/play:
    post:
      operationId: spotifyPlay
      tags: [spotify]
      summary: Play a recording (full track) on the listener's own Spotify
      description: >
        Resolves the MBID to a Spotify track (exact link > ISRC > artist+title
        search) and starts playback on the listener's active Spotify device via
        the Connect API. Requires Premium and an open Spotify app somewhere.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpotifyPlayRequest"
      responses:
        "200":
          description: Playback started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpotifyPlayResult"
        "401":
          description: No Spotify connection for this session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Spotify Premium required for remote playback
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Recording unknown or not found on Spotify
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: No active Spotify device (open Spotify on any device)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Spotify not configured on the server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /spotify/pause:
    post:
      operationId: spotifyPause
      tags: [spotify]
      summary: Pause the listener's Spotify playback
      responses:
        "204":
          description: Paused (idempotent; also 204 when nothing was playing)
        "401":
          description: No Spotify connection for this session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /spotify/resume:
    post:
      operationId: spotifyResume
      tags: [spotify]
      summary: Resume the listener's Spotify playback
      responses:
        "204":
          description: Resumed
        "401":
          description: No Spotify connection for this session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: No active Spotify device
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /spotify/save:
    post:
      operationId: spotifySave
      tags: [spotify]
      summary: Save a recording to the listener's Spotify Liked Songs
      description: >
        Resolves the MBID to a Spotify track (exact link > ISRC > artist+title
        search) and saves it to the listener's library. Works on any Spotify
        tier (no Premium requirement). A 403 with code `insufficient_scope`
        means the connection predates library access — reconnect to grant it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpotifyPlayRequest"
      responses:
        "200":
          description: Track saved to Liked Songs (idempotent)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpotifySaveResult"
        "401":
          description: No Spotify connection for this session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Connection lacks library scope — reconnect required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Recording unknown or not found on Spotify
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Spotify library request failed upstream
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Spotify not configured on the server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /spotify/saved:
    get:
      operationId: getSpotifySaved
      tags: [spotify]
      summary: Whether a recording is already in the listener's Liked Songs
      parameters:
        - name: mbid
          in: query
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Saved state for the resolved Spotify track
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpotifySaveResult"
        "401":
          description: No Spotify connection for this session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Connection lacks library scope — reconnect required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Recording unknown or not found on Spotify
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Spotify library request failed upstream
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /spotify/player:
    get:
      operationId: getSpotifyPlayer
      tags: [spotify]
      summary: Snapshot of the listener's Spotify player state
      description: >
        Polled by the ride player to detect track end (auto-advance). `active`
        is false when Spotify reports no active playback session.
      responses:
        "200":
          description: Player state snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpotifyPlayerState"
        "401":
          description: No Spotify connection for this session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /spotify/devices:
    get:
      operationId: getSpotifyDevices
      tags: [spotify]
      summary: List available Spotify Connect devices for this session
      description: >
        Returns all Spotify Connect devices currently visible to the listener's
        account (`GET /v1/me/player/devices`). Used to populate the device
        picker so the listener can pin a target for one-at-a-time queuing.
        Restricted devices are excluded. Requires Premium and a connected
        Spotify account.
      responses:
        "200":
          description: List of available Spotify Connect devices
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpotifyDevicesResult"
        "401":
          description: No Spotify connection for this session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Spotify not configured on the server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /me/pickers/overlap:
    get:
      operationId: getMyPickerOverlap
      tags: [me]
      summary: DJ picker overlap with the user's full library (RG-widened)
      description: >
        Returns all DJ pickers whose picks intersect the caller's library_items,
        using exact-MBID and primary-release-group widening — same logic as
        /me/crossings. Counts are over the full library (no sampling cap).
        Results are cached per-user for 5 minutes server-side. Returns an empty
        array for unauthenticated requests.
      responses:
        "200":
          description: Picker overlap items (may be empty)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MePickerOverlapResult"
  /me/library/list-coverage:
    get:
      operationId: getMyLibraryListCoverage
      tags: [me]
      summary: Publication list coverage for the user's library
      description: >
        Returns lists from music publications that feature albums from the
        listener's library. Grouped by list (publication name + year), each
        entry includes the matched albums with their rank. Only confirmed or
        exact-confidence list_entries are returned. Returns an empty array
        when the library has no list coverage. Requires an active lore session
        cookie — returns an empty array for unauthenticated requests.
      responses:
        "200":
          description: List coverage (may be empty)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryCoverageResponse"
  /me/library/starter:
    get:
      operationId: getMyMattStarterLibrary
      tags: [me]
      summary: Check whether the Matt starter library is available
      description: >
        Returns only the availability and count of the operator-owned starter
        library. The source account identity is server-managed and is never
        accepted from the caller.
      responses:
        "200":
          description: Starter library availability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MattStarterLibraryResult"
    post:
      operationId: copyMattStarterLibrary
      tags: [me]
      summary: Copy the Matt starter library into the listener's library
      description: >
        Adds resolved tracks from the configured operator-owned starter library.
        Existing listener tracks are left unchanged, making this operation safe
        to repeat. No Spotify connection is required.
      responses:
        "200":
          description: Copy result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MattStarterLibraryResult"
        "503":
          description: Starter library is not configured or unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MattStarterLibraryResult"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ApiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    Credit:
      type: object
      properties:
        role:
          type: string
        name:
          type: string
        artistId:
          type: ["string", "null"]
      required:
        - role
        - name
    DiscogsPressing:
      type: object
      properties:
        label:
          type: ["string", "null"]
        year:
          type: ["integer", "null"]
        country:
          type: ["string", "null"]
        format:
          type: ["string", "null"]
    SongRelationship:
      type: object
      description: >-
        A typed, directional song-to-song relationship parsed from MusicBrainz.
        direction="forward" means THIS song is the source (it samples / is a
        cover of / is a remix of / interpolates the target); "backward" means the
        related entity does so to THIS song. The web graph renders each as a
        typed edge to a node identified by targetType + targetId.
      properties:
        kind:
          type: string
          enum: [sample, cover, remix, interpolation]
        direction:
          type: string
          enum: [forward, backward]
        label:
          type: string
        title:
          type: string
        artist:
          type: ["string", "null"]
        year:
          type: ["integer", "null"]
        targetType:
          type: string
          enum: [recording, work]
        targetId:
          type: string
        mbUrl:
          type: string
      required:
        - kind
        - direction
        - label
        - title
        - targetType
        - targetId
        - mbUrl
    TrackKnowledge:
      type: object
      properties:
        recordingId:
          type: ["string", "null"]
        artistId:
          type: ["string", "null"]
        artistName:
          type: ["string", "null"]
        personnel:
          type: array
          items:
            $ref: "#/components/schemas/Credit"
        pressing:
          anyOf:
            - $ref: "#/components/schemas/DiscogsPressing"
            - type: "null"
        relationships:
          type: array
          items:
            $ref: "#/components/schemas/SongRelationship"
        summary:
          type: ["string", "null"]
        approximate:
          type: boolean
        fetchedAtMs:
          type: number
      required:
        - personnel
        - approximate
        - fetchedAtMs
    TrackContext:
      type: object
      properties:
        artistId:
          type: ["string", "null"]
        artistName:
          type: ["string", "null"]
        tags:
          type: array
          items:
            type: string
        similarArtists:
          type: array
          items:
            type: string
        bio:
          type: ["string", "null"]
        wikipediaUrl:
          type: ["string", "null"]
        geniusUrl:
          type: ["string", "null"]
        summary:
          type: ["string", "null"]
        approximate:
          type: boolean
        fetchedAtMs:
          type: number
      required:
        - tags
        - similarArtists
        - approximate
        - fetchedAtMs
    CatalogueTrack:
      type: object
      properties:
        id:
          type: string
        uri:
          type: string
        title:
          type: string
      required:
        - id
        - uri
        - title
    CatalogueAlbum:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        year:
          type: ["integer", "null"]
        url:
          type: string
      required:
        - id
        - name
        - url
    ArtistCatalogue:
      type: object
      properties:
        artistId:
          type: string
        artistName:
          type: string
        artistUrl:
          type: string
        topTracks:
          type: array
          items:
            $ref: "#/components/schemas/CatalogueTrack"
        albums:
          type: array
          items:
            $ref: "#/components/schemas/CatalogueAlbum"
      required:
        - artistId
        - artistName
        - artistUrl
        - topTracks
        - albums
    TrackLink:
      type: object
      properties:
        name:
          type: string
        url:
          type: string
      required:
        - name
        - url
    TrackLinks:
      type: object
      properties:
        platforms:
          type: array
          items:
            $ref: "#/components/schemas/TrackLink"
        pageUrl:
          type: ["string", "null"]
        fetchedAtMs:
          type: number
      required:
        - platforms
        - fetchedAtMs
    TrackInsight:
      type: object
      properties:
        positionMs:
          type: number
        text:
          type: string
      required:
        - positionMs
        - text
    ResolvedSong:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        artists:
          type: array
          items:
            type: string
        album:
          type: ["string", "null"]
        imageUrl:
          type: ["string", "null"]
        spotifyUrl:
          type: string
        isrc:
          type: ["string", "null"]
          description: International Standard Recording Code, when Spotify exposes it. The canonical identifier for sample-clearance requests.
        oEmbedHtml:
          type: ["string", "null"]
      required:
        - id
        - name
        - artists
        - spotifyUrl
    SongContext:
      type: object
      properties:
        track:
          $ref: "#/components/schemas/ResolvedSong"
        knowledge:
          anyOf:
            - $ref: "#/components/schemas/TrackKnowledge"
            - type: "null"
        context:
          anyOf:
            - $ref: "#/components/schemas/TrackContext"
            - type: "null"
        catalogue:
          anyOf:
            - $ref: "#/components/schemas/ArtistCatalogue"
            - type: "null"
        links:
          anyOf:
            - $ref: "#/components/schemas/TrackLinks"
            - type: "null"
        insights:
          type: array
          items:
            $ref: "#/components/schemas/TrackInsight"
      required:
        - track
        - insights
    OEmbed:
      type: object
      properties:
        html:
          type: string
        title:
          type: ["string", "null"]
        thumbnail_url:
          type: ["string", "null"]
        width:
          type: ["integer", "null"]
        height:
          type: ["integer", "null"]
        provider_name:
          type: ["string", "null"]
      required:
        - html
    Station:
      type: object
      description: A curated radio station in the public directory.
      properties:
        id:
          type: integer
          description: Numeric primary key — stable across renames, used to link listen records to their station.
        slug:
          type: string
        name:
          type: string
        org:
          type: ["string", "null"]
        city:
          type: ["string", "null"]
          description: >-
            City the station broadcasts from, when known. Used alongside org and
            country for the station's location byline.
        country:
          type: ["string", "null"]
        streamUrl:
          type: string
        streamQuality:
          type: ["string", "null"]
        streamFormat:
          type: string
          description: Playback hint — "aac", "mp3", "hls", or "flac".
        mode:
          type: string
        homepageUrl:
          type: ["string", "null"]
        donateUrl:
          type: ["string", "null"]
        logoUrl:
          type: ["string", "null"]
        attribution:
          type: boolean
        tags:
          type: ["array", "null"]
          items:
            type: string
        mayHaveAds:
          type: boolean
          description: >-
            Cheap metadata-only signal ("this station will continue after
            this break", sponsor reads, etc) suggests this station airs ad
            breaks. Not a certainty — surfaces as a "may contain ads" hint,
            not a guarantee either way.
        votes:
          type: integer
          description: radio-browser.info community vote count (0 for curated stations never seen there).
        clickcount:
          type: integer
          description: radio-browser.info click count, a proxy for cross-network listener demand.
        discoveryScore:
          type: ["number", "null"]
          description: >-
            0-100 cached discovery score (higher = newer/more "discovery"-leaning
            rotation), recomputed periodically from logged spins. Null until enough
            resolved spin history exists to compute one.
        homepageBlurb:
          type: ["string", "null"]
          description: >-
            Best-effort excerpt (title/meta description) scraped from the station's
            own homepage. Null when never scraped, blocked by robots.txt, or the
            page had no usable text — never fabricated.
        upcomingShowCount:
          type: integer
          description: >-
            Count of scraped upcoming shows in this station's weekly programming
            grid. 0 when the schedule scraper has not found shows yet.
        tier:
          type: ["string", "null"]
          description: >-
            Station tier — "flagship" for editorially curated stations,
            "longtail" for auto-discovered ones.
        qualityTier:
          type: ["string", "null"]
          enum: ["proven", "promising", "raw", "silent", "unscored", null]
          description: >-
            Ingest quality tier derived from the last 7 days of logged spins.
            "proven" = strong MBID resolution (≥40%); "promising" = mostly
            track-shaped spins (≥50%); "raw" = metadata present but low
            resolution (≥20% yield); "silent" = active but near-zero usable
            metadata; "unscored" = fewer than 20 spins in the window. Null
            until the nightly quality recompute job has run at least once.
        automationClass:
          type: ["string", "null"]
          enum: ["automated", "human", null]
          description: >-
            Broad classification of how a station's programming is produced.
            "automated" = algorithmic/jukebox rotation, no human curation;
            "human" = live or pre-recorded human-selected programming.
            Stations that mix both are resolved to "human" or "automated" at
            query time and never returned as "mixed". Null when not yet
            classified.
      required:
        - id
        - slug
        - name
        - streamUrl
        - streamFormat
        - mode
        - attribution
        - mayHaveAds
        - votes
        - clickcount
        - upcomingShowCount
    StationList:
      type: object
      properties:
        stations:
          type: array
          items:
            $ref: "#/components/schemas/Station"
      required:
        - stations
    RecordingLink:
      type: object
      description: >-
        A cross-service deep link. kind="exact" points at the precise recording
        (resolved via Odesli); kind="search" is a best-effort artist+title search
        on that service.
      properties:
        name:
          type: string
        url:
          type: string
        kind:
          type: string
          enum: [exact, search]
      required:
        - name
        - url
        - kind
    RecordingNode:
      type: object
      description: >-
        A recording's own metadata, keyed by MusicBrainz Recording ID, for the
        song page. artistMbid powers artist-level attribution; artwork and links
        are best-effort and may be absent.
      properties:
        mbid:
          type: string
        title:
          type: string
        artist:
          type: string
        artistMbid:
          type: ["string", "null"]
        durationMs:
          type: ["integer", "null"]
        artworkUrl:
          type: ["string", "null"]
        links:
          type: array
          items:
            $ref: "#/components/schemas/RecordingLink"
      required:
        - mbid
        - title
        - artist
        - links
    RecordingPreview:
      type: object
      description: >-
        A best-effort 30s preview clip for a recording. All fields may be null
        when no preview was found; the audio streams directly from the source's
        CDN, never through Lore.
      properties:
        mbid:
          type: string
        previewUrl:
          type: ["string", "null"]
        artworkUrl:
          type: ["string", "null"]
        source:
          type: ["string", "null"]
      required:
        - mbid
    NowPlayingRecording:
      type: object
      description: The MBID-keyed recording a spin resolved to.
      properties:
        mbid:
          type: string
        title:
          type: string
        artist:
          type: string
        artistMbid:
          type: ["string", "null"]
        artworkUrl:
          type: ["string", "null"]
        links:
          type: array
          items:
            $ref: "#/components/schemas/RecordingLink"
        genres:
          type: array
          items:
            type: string
          nullable: true
          description: >-
            MusicBrainz-sourced genre tags for the recording, most-relevant
            first. Null when the recording has not been enriched yet.
      required:
        - mbid
        - title
        - artist
        - links
    NowPlaying:
      type: object
      description: >-
        The most recent spin on a station. `recording` is null when the track
        could not be resolved to the MusicBrainz spine (raw metadata preserved).
      properties:
        spinId:
          type: ["integer", "null"]
          description: >-
            DB primary key of the underlying spin row. Present on every
            now-playing response so listeners can save unresolved tracks before
            MB resolution completes.
        rawArtist:
          type: string
        rawTitle:
          type: string
        source:
          type: ["string", "null"]
        confidence:
          type: string
          enum: [recording_id, isrc, text, unresolved, spotify]
        playedAt:
          type: string
        artworkUrl:
          type: ["string", "null"]
        recording:
          anyOf:
            - $ref: "#/components/schemas/NowPlayingRecording"
            - type: "null"
        show:
          description: Show + DJ on air for this spin, when the source exposes it.
          anyOf:
            - $ref: "#/components/schemas/ShowRef"
            - type: "null"
        isFirstSpin:
          type: boolean
          description: >-
            True when this is the first time this recording (by MBID) has
            appeared in the archive. False when the recording has been logged
            before, or when the spin has no resolved MBID.
        isLibraryHit:
          type: boolean
          description: >-
            True when the spin's recording (or any track from the same primary
            release group) is in the authenticated listener's library. Always
            false for unauthenticated requests.
        isArtistHit:
          type: boolean
          description: >-
            True when the spin's artist is in the listener's library but the
            exact track/album is not — the rung-3 "fan" signal. Always false
            for unauthenticated requests.
      required:
        - rawArtist
        - rawTitle
        - confidence
        - playedAt
        - isLibraryHit
        - isArtistHit
    StationNowPlaying:
      type: object
      properties:
        station:
          $ref: "#/components/schemas/Station"
        nowPlaying:
          anyOf:
            - $ref: "#/components/schemas/NowPlaying"
            - type: "null"
      required:
        - station
    StationPulse:
      type: object
      description: One station's latest spin, for the dial's live pulse.
      properties:
        slug:
          type: string
        nowPlaying:
          anyOf:
            - $ref: "#/components/schemas/NowPlaying"
            - type: "null"
      required:
        - slug
    StationPulseList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/StationPulse"
      required:
        - items
    LyricLine:
      type: object
      description: >
        One time-indexed lyric cue from a synced lyrics source (LRCLIB).
        offset_ms is the millisecond offset from the start of the recording.
      properties:
        offsetMs:
          type: integer
          description: Milliseconds from the start of the recording.
        text:
          type: string
          description: The lyric text for this cue.
      required:
        - offsetMs
        - text
    RecordingLyrics:
      type: object
      description: >
        Lyric lines for a recording. synced=true means time-coded (LRC);
        synced=false means static plain lyrics. lines is empty when LRCLIB
        has no lyrics at all.
      properties:
        synced:
          type: boolean
        lines:
          type: array
          items:
            $ref: "#/components/schemas/LyricLine"
      required:
        - synced
        - lines
    GeniusDraft:
      type: object
      description: >
        A pending Genius annotation draft awaiting admin review. Only a
        normalized-fragment SHA-256 receipt and character length are retained;
        raw third-party lyric text is never stored or surfaced. `anchorType =
        'timestamp'` means `offsetMs` is set and the claim will be anchored to
        the matching lyric line on publish.
      properties:
        id:
          type: integer
        mbid:
          type: string
        geniusSongId:
          type: integer
        geniusAnnotationId:
          type: integer
        fragmentHash:
          type: string
          description: SHA-256 receipt of the normalized lyric fragment.
        fragmentLen:
          type: integer
          minimum: 0
          description: Character length of the normalized lyric fragment.
        anchorType:
          type: string
          enum: [timestamp, none]
        offsetMs:
          anyOf:
            - type: integer
            - type: "null"
        geniusUrl:
          type: string
        verified:
          type: boolean
        voteCount:
          type: integer
        status:
          type: string
          enum: [draft, published, rejected]
      required:
        - id
        - mbid
        - geniusSongId
        - geniusAnnotationId
        - fragmentHash
        - fragmentLen
        - anchorType
        - geniusUrl
        - verified
        - voteCount
        - status
    GeniusDraftList:
      type: object
      properties:
        mbid:
          type: string
        drafts:
          type: array
          items:
            $ref: "#/components/schemas/GeniusDraft"
      required:
        - mbid
        - drafts
    GeniusDraftReviewRequest:
      type: object
      description: >
        Admin review action for a Genius annotation draft. `action = 'publish'`
        requires a non-empty `text` (the admin's paraphrase of the annotation).
        `action = 'reject'` requires no text.
      properties:
        action:
          type: string
          enum: [publish, reject]
        text:
          type: string
          description: >
            Admin-written paraphrase of the Genius annotation — required when
            action = 'publish'. Never the verbatim annotation text.
          minLength: 1
      required:
        - action
    GeniusDraftReviewResponse:
      type: object
      properties:
        id:
          type: integer
        action:
          type: string
          enum: [published, rejected]
        claimId:
          anyOf:
            - type: integer
            - type: "null"
          description: The new track_claim id when action = 'published'.
      required:
        - id
        - action
    TrackClaim:
      type: object
      description: >
        One grounded fact about a recording, extracted systematically from an
        official documentary source (e.g. a Classic Albums making-of clip, a
        Wikipedia article section, or a Genius annotation). `sourceUrl`
        deep-links to the supporting moment or section in the original source,
        so every claim is one tap from its evidence. `anchorType` distinguishes
        timestamp-anchored (null) from section-anchored ('section') claims.
        Section claims carry `anchorValue` (the Wikipedia section label, e.g.
        "Recording") and a `sourceUrl` that is a Wikipedia deep link to that
        section. `verified` is true for artist-verified Genius annotations.
        `sourceHandle` identifies the picker that produced this claim (e.g.
        "genius", "classic-albums") so UIs can apply source-specific treatment.
      properties:
        id:
          type: integer
          description: Database row id (needed for admin PATCH).
        text:
          type: string
        sourceLabel:
          type: string
        sourceUrl:
          type: string
        positionMs:
          anyOf:
            - type: integer
            - type: "null"
        anchorType:
          anyOf:
            - type: string
              enum: ["section"]
            - type: "null"
          description: >
            'section' for Wikipedia section claims; null for timestamp-anchored
            claims (positionMs carries the offset).
        anchorValue:
          anyOf:
            - type: string
            - type: "null"
          description: >
            Section label when anchorType='section' (e.g. "Recording",
            "Production", "Composition", "Background",
            "Critical reception"). Null for timestamp-anchored claims.
        status:
          type: string
          enum: ["draft", "published", "rejected"]
          description: >
            Review status. Only 'published' claims are surfaced to end users
            on the song page. 'draft' = awaiting admin review (Wikipedia
            candidates). 'rejected' = discarded by admin.
        sourceHandle:
          type: string
          description: >
            Origin handle for the claim. 'classic-albums' for Classic Albums
            documentary clips. 'wikipedia' for track-level Wikipedia section
            claims. 'wikipedia-album' for album-level Wikipedia section claims
            (sourced from the recording's canonical album article).
            'genius' for Genius annotation-derived claims.
        verified:
          type: boolean
          description: True for artist-verified Genius annotations.
      required:
        - text
        - sourceLabel
        - sourceUrl
        - sourceHandle
    AllDraftClaimsList:
      type: object
      properties:
        claims:
          type: array
          items:
            $ref: "#/components/schemas/AllDraftClaim"
      required:
        - claims
    AllDraftClaim:
      type: object
      description: >
        A Wikipedia draft claim awaiting admin review, enriched with a joined
        track title when the recording is known.
      properties:
        id:
          type: integer
        mbid:
          type: string
        trackTitle:
          type: ["string", "null"]
          description: Recording title from the recordings table, if available.
        trackArtist:
          type: ["string", "null"]
          description: Recording artist from the recordings table, if available.
        anchorValue:
          type: string
          description: Section label (e.g. "Recording", "Production").
        sourceLabel:
          type: string
          description: "Wikipedia article title."
        sourceUrl:
          type: string
          description: Deep link to the Wikipedia section.
        status:
          type: string
          enum: ["draft", "published", "rejected"]
        createdAt:
          type: string
      required:
        - id
        - mbid
        - anchorValue
        - sourceLabel
        - sourceUrl
        - status
        - createdAt
    WikipediaDraftList:
      type: object
      properties:
        claims:
          type: array
          items:
            $ref: "#/components/schemas/WikipediaDraftClaim"
      required:
        - claims
    WikipediaDraftClaim:
      type: object
      description: >
        A Wikipedia draft track claim awaiting admin review. The admin fills in
        `text` (a paraphrase of the section's key fact) before publishing.
        No Wikipedia prose is stored — only the section URL pointer and the
        admin-written paraphrase.
      properties:
        id:
          type: integer
        mbid:
          type: string
        anchorValue:
          type: string
          description: Section label (e.g. "Recording", "Production").
        sourceLabel:
          type: string
          description: "Wikipedia article title, e.g. 'Wikipedia — Go Your Own Way'."
        sourceUrl:
          type: string
          description: Deep link to the Wikipedia section.
        status:
          type: string
          enum: ["draft", "published", "rejected"]
        createdAt:
          type: string
      required:
        - id
        - mbid
        - anchorValue
        - sourceLabel
        - sourceUrl
        - status
        - createdAt
    PatchClaimRequest:
      type: object
      description: >
        Admin claim review: provide the paraphrased claim text and set status
        to 'published' (to publish) or 'rejected' (to discard). Text is
        required when publishing — it must be the admin-written paraphrase of
        the Wikipedia section's key fact, never verbatim Wikipedia prose.
      properties:
        text:
          type: string
          minLength: 1
        status:
          type: string
          enum: ["published", "rejected"]
      required:
        - status
    AlbumTrack:
      type: object
      properties:
        title:
          type: string
        trackNumber:
          type: integer
        mbid:
          type: ["string", "null"]
      required:
        - title
        - trackNumber
    AlbumContext:
      type: object
      properties:
        name:
          type: string
        year:
          type: ["integer", "null"]
        spotifyAlbumId:
          type: ["string", "null"]
        releaseGroupMbid:
          type: ["string", "null"]
        tracks:
          type: array
          items:
            $ref: "#/components/schemas/AlbumTrack"
      required:
        - name
        - tracks
    AlbumResultTrack:
      type: object
      description: A single track within an album result, cross-referenced with Lore spin data.
      properties:
        mbid:
          type: string
        title:
          type: string
        artist:
          type: string
        artistMbid:
          type: string
          nullable: true
        artworkUrl:
          type: string
          nullable: true
        spinCount:
          type: integer
        lastSpunAt:
          type: string
          nullable: true
      required: [mbid, title, artist, artistMbid, artworkUrl, spinCount, lastSpunAt]
    AlbumResult:
      type: object
      description: An album (release group) with its tracks, cross-referenced with Lore spin data.
      properties:
        releaseGroupMbid:
          type: string
        title:
          type: string
        releaseYear:
          type: integer
          nullable: true
        primaryType:
          type: string
          nullable: true
        tracks:
          type: array
          items:
            $ref: "#/components/schemas/AlbumResultTrack"
      required: [releaseGroupMbid, title, releaseYear, primaryType, tracks]
    RecordingKnowledge:
      type: object
      properties:
        knowledge:
          anyOf:
            - $ref: "#/components/schemas/TrackKnowledge"
            - type: "null"
        album:
          description: >-
            Album context resolved from Spotify, with cross-referenced Lore
            MBIDs per track.
          anyOf:
            - $ref: "#/components/schemas/AlbumContext"
            - type: "null"
        claims:
          type: array
          description: Grounded documentary-sourced facts (may be empty).
          items:
            $ref: "#/components/schemas/TrackClaim"
      required:
        - knowledge
    StationRef:
      type: object
      description: A station reference used in spin/segue attribution.
      properties:
        slug:
          type: string
        name:
          type: string
        stationClass:
          type: string
      required:
        - slug
        - name
        - stationClass
    ShowRef:
      type: object
      description: Show + DJ attribution for a spin, when the source exposes it.
      properties:
        name:
          type: string
        djName:
          type: ["string", "null"]
        sourceUrl:
          type: string
          format: uri
          description: URL of the station schedule page that produced this row.
        scrapedAt:
          type: string
          format: date-time
          description: When this schedule row was extracted.
        extraction:
          type: string
          enum: [llm, api, manual]
      required:
        - name
    RecordingSpin:
      type: object
      description: One logged play of a recording, with station + show attribution.
      properties:
        playedAt:
          type: string
        source:
          type: ["string", "null"]
        confidence:
          type: string
          enum: [recording_id, isrc, text, unresolved, spotify]
        station:
          $ref: "#/components/schemas/StationRef"
        show:
          anyOf:
            - $ref: "#/components/schemas/ShowRef"
            - type: "null"
        runId:
          type: ["integer", "null"]
          description: >-
            The archived station run (show + UTC broadcast day) this spin
            belongs to — an opaque id for /archive/station-runs/{runId}, so a
            song page can jump into the ghost run containing this play.
            Optional for older cached payloads.
      required:
        - playedAt
        - confidence
        - station
    RecordingSpins:
      type: object
      properties:
        mbid:
          type: string
        spins:
          type: array
          items:
            $ref: "#/components/schemas/RecordingSpin"
      required:
        - mbid
        - spins
    PickerRef:
      type: object
      description: A picker reference used in pick attribution.
      properties:
        name:
          type: string
        handle:
          type: string
        pickerType:
          type: string
        trustTier:
          type: integer
      required:
        - name
        - handle
        - pickerType
        - trustTier
    RecordingPick:
      type: object
      description: >-
        One curated pick of a recording — the reverse edge of the song–source
        graph. `runId` locates the specific list (null when the pick has no
        source URL and therefore no archived run).
      properties:
        picker:
          $ref: "#/components/schemas/PickerRef"
        runId:
          type: ["integer", "null"]
        listTitle:
          type: ["string", "null"]
        sourceUrl:
          type: ["string", "null"]
        pickedAt:
          type: ["string", "null"]
        ordinal:
          type: ["integer", "null"]
          description: Position within an ordered list; null for unordered sources.
        trackCount:
          type: integer
          description: Total picks in the same run (0 when the pick has no run).
        confidence:
          type: string
          enum: [recording_id, isrc, text, unresolved, spotify]
      required:
        - picker
        - runId
        - listTitle
        - sourceUrl
        - pickedAt
        - ordinal
        - trackCount
        - confidence
    RecordingPicks:
      type: object
      properties:
        mbid:
          type: string
        picks:
          type: array
          items:
            $ref: "#/components/schemas/RecordingPick"
      required:
        - mbid
        - picks
    PickerOverlap:
      type: object
      description: One picker sharing recordings with a station (exact MBID overlap).
      properties:
        picker:
          $ref: "#/components/schemas/PickerRef"
        sharedCount:
          type: integer
          description: Distinct recordings both the picker and the station touched.
      required:
        - picker
        - sharedCount
    StationPickerOverlaps:
      type: object
      properties:
        station:
          $ref: "#/components/schemas/StationRef"
        items:
          type: array
          items:
            $ref: "#/components/schemas/PickerOverlap"
      required:
        - station
        - items
    StationOverlap:
      type: object
      description: One station sharing recordings with a picker (exact MBID overlap).
      properties:
        station:
          $ref: "#/components/schemas/StationRef"
        sharedCount:
          type: integer
          description: Distinct recordings both the station and the picker touched.
      required:
        - station
        - sharedCount
    PickerStationOverlaps:
      type: object
      properties:
        picker:
          $ref: "#/components/schemas/PickerRef"
        items:
          type: array
          items:
            $ref: "#/components/schemas/StationOverlap"
      required:
        - picker
        - items
    PickedLookupItem:
      type: object
      description: >-
        The strongest editorial pick for one MBID — used by the live dial's
        "also picked" badge.
      properties:
        mbid:
          type: string
        picker:
          $ref: "#/components/schemas/PickerRef"
        runId:
          type: ["integer", "null"]
        listTitle:
          type: ["string", "null"]
      required:
        - mbid
        - picker
        - runId
        - listTitle
    PickedLookup:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PickedLookupItem"
      required:
        - items
    StationRunSummary:
      type: object
      description: >-
        One documented station run — a show's plays on one UTC broadcast day.
        `runId` is opaque (fetch the tracklist via /archive/station-runs).
      properties:
        runId:
          type: integer
        date:
          type: string
          description: UTC broadcast day, YYYY-MM-DD.
        show:
          anyOf:
            - $ref: "#/components/schemas/ShowRef"
            - type: "null"
        spinCount:
          type: integer
        resolvedCount:
          type: integer
          description: Spins resolved to the MBID spine (replayable tracks).
        sourceUrl:
          type: ["string", "null"]
          description: >-
            Outbound link to the source's own archive for this run (e.g. the
            station's dated playlist page, or a manual spin's citation). Null
            when the source has no public per-day archive.
        startedAt:
          type: string
        endedAt:
          type: string
      required:
        - runId
        - date
        - spinCount
        - resolvedCount
        - sourceUrl
        - startedAt
        - endedAt
    StationArchive:
      type: object
      properties:
        station:
          $ref: "#/components/schemas/Station"
        runs:
          type: array
          items:
            $ref: "#/components/schemas/StationRunSummary"
      required:
        - station
        - runs
    StationSpinsBounds:
      type: object
      description: >-
        The full time range this station's spin history covers, so a client
        can render a continuous scrub control without loading every page.
      properties:
        oldestSpinAt:
          type: ["string", "null"]
        newestSpinAt:
          type: ["string", "null"]
        spinCount:
          type: integer
      required:
        - oldestSpinAt
        - newestSpinAt
        - spinCount
    ScrapedShow:
      type: object
      description: >-
        One entry in a station's own published weekly programming grid.
        Times are the station's own local wall-clock times as published
        (timezone not modeled), describing a recurring weekly slot rather
        than a specific calendar date.
      properties:
        showName:
          type: string
        dayOfWeek:
          type: string
          enum: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        startTime:
          type: string
          description: 24h "HH:MM"
        endTime:
          type: string
          description: 24h "HH:MM"
        djName:
          type: ["string", "null"]
        sourceUrl:
          type: string
          format: uri
          description: URL of the station schedule page that produced this row.
        scrapedAt:
          type: string
          format: date-time
          description: When this schedule row was extracted.
        extraction:
          type: string
          enum: [llm, api, manual]
      required:
        - showName
        - dayOfWeek
        - startTime
        - endTime
        - djName
        - sourceUrl
        - scrapedAt
        - extraction
    VoidScrapedShowRequest:
      type: object
      properties:
        reason:
          type: string
          minLength: 1
          description: Required explanation for withdrawing the schedule evidence.
      required:
        - reason
    VoidScrapedShowResponse:
      allOf:
        - $ref: "#/components/schemas/ScrapedShow"
        - type: object
          properties:
            id:
              type: integer
            stationId:
              type: integer
            voidedAt:
              type: ["string", "null"]
              format: date-time
            voidReason:
              type: ["string", "null"]
          required:
            - id
            - stationId
            - voidedAt
            - voidReason
    StationUpcomingSchedule:
      type: object
      description: >-
        A station's scraped upcoming schedule. `shows` is empty (never
        fabricated) when the station's page had no parseable schedule.
      properties:
        stationSlug:
          type: string
        shows:
          type: array
          items:
            $ref: "#/components/schemas/ScrapedShow"
        lastScrapedAt:
          type: ["string", "null"]
          description: >-
            ISO timestamp of the last successful schedule scrape. Null when
            never successfully scraped.
        timezoneHint:
          type: ["string", "null"]
          description: >-
            Best-effort IANA timezone identifier inferred from the station's city
            and country (e.g. "America/Los_Angeles"). Null when the timezone
            cannot be confidently determined.
      required:
        - stationSlug
        - shows
        - lastScrapedAt
        - timezoneHint
    DjShowEntry:
      type: object
      description: One scraped weekly show slot for a DJ at a specific station.
      properties:
        stationSlug:
          type: string
        stationName:
          type: string
        showName:
          type: string
        dayOfWeek:
          type: string
          enum: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        startTime:
          type: string
          description: 24h "HH:MM"
        endTime:
          type: string
          description: 24h "HH:MM"
      required:
        - stationSlug
        - stationName
        - showName
        - dayOfWeek
        - startTime
        - endTime
    DjShows:
      type: object
      description: All scraped upcoming shows for a DJ across all stations.
      properties:
        djName:
          type: string
        shows:
          type: array
          items:
            $ref: "#/components/schemas/DjShowEntry"
      required:
        - djName
        - shows
    StationSpinsPage:
      type: object
      description: >-
        One page of a station's spin history, newest first, independent of
        show/run grouping.
      properties:
        station:
          $ref: "#/components/schemas/StationRef"
        tracks:
          type: array
          items:
            $ref: "#/components/schemas/ArchiveTrack"
        nextBefore:
          type: ["string", "null"]
          description: >-
            Pass as `before` to fetch the next (older) page. Null when this
            page reached the oldest logged spin.
        bounds:
          $ref: "#/components/schemas/StationSpinsBounds"
      required:
        - station
        - tracks
        - nextBefore
        - bounds
    ArchiveTrack:
      type: object
      description: >-
        One slot of an archived run, in documented order. `recording` is null
        when the track never resolved to the spine (raw metadata preserved —
        the honesty gradient stays visible even in replay).
      properties:
        position:
          type: integer
        playedAt:
          type: ["string", "null"]
        rawArtist:
          type: string
        rawTitle:
          type: string
        confidence:
          type: string
          enum: [recording_id, isrc, text, unresolved, spotify]
        recording:
          anyOf:
            - $ref: "#/components/schemas/NowPlayingRecording"
            - type: "null"
      required:
        - position
        - rawArtist
        - rawTitle
        - confidence
    StationRunDetail:
      type: object
      properties:
        station:
          $ref: "#/components/schemas/StationRef"
        run:
          $ref: "#/components/schemas/StationRunSummary"
        tracks:
          type: array
          items:
            $ref: "#/components/schemas/ArchiveTrack"
      required:
        - station
        - run
        - tracks
    ReplayPicker:
      type: object
      description: Public picker/DJ attribution joined from the originating show.
      properties:
        name:
          type: string
        handle:
          type: string
        pickerType:
          type: string
        trustTier:
          type: integer
      required:
        - name
        - handle
        - pickerType
        - trustTier
    ReplayEntry:
      type: object
      description: One archived spin, including unresolved source metadata.
      properties:
        position:
          type: integer
        spinId:
          type: integer
          description: Source spins primary key used for Keep provenance.
        playedAt:
          type: string
        source:
          type: ["string", "null"]
        citation:
          type: ["string", "null"]
        rawArtist:
          type: string
        rawTitle:
          type: string
        confidence:
          type: string
          enum: [recording_id, isrc, text, unresolved, spotify]
        recording:
          anyOf:
            - $ref: "#/components/schemas/NowPlayingRecording"
            - type: "null"
        guidedLinks:
          type: array
          description: >
            Durable service mappings for official guided replay embeds. These
            links are separate from presentation links and retain dead-link
            state without changing the broadcast manifest.
          items:
            type: object
            properties:
              service:
                type: string
              externalId:
                type: ["string", "null"]
              url:
                type: string
              deadLink:
                type: boolean
            required: [service, externalId, url, deadLink]
      required:
        - position
        - spinId
        - playedAt
        - source
        - citation
        - rawArtist
        - rawTitle
        - confidence
        - recording
        - guidedLinks
    ReplayManifest:
      type: object
      description: >
        Stable, server-derived Ghost Replay view over one station broadcast
        partition. Coverage counts are explicit so clients do not infer
        missing entries from the resolved subset.
      properties:
        replayId:
          type: integer
        station:
          $ref: "#/components/schemas/StationRef"
        show:
          anyOf:
            - $ref: "#/components/schemas/ShowRef"
            - type: "null"
        picker:
          anyOf:
            - $ref: "#/components/schemas/ReplayPicker"
            - type: "null"
        bounds:
          type: object
          properties:
            date:
              type: string
            startedAt:
              type: string
            endedAt:
              type: string
          required: [date, startedAt, endedAt]
        coverage:
          type: object
          properties:
            total:
              type: integer
            resolved:
              type: integer
            unresolved:
              type: integer
          required: [total, resolved, unresolved]
        entries:
          type: array
          items:
            $ref: "#/components/schemas/ReplayEntry"
      required:
        - replayId
        - station
        - show
        - picker
        - bounds
        - coverage
        - entries
    GuidedReplayQueueTarget:
      type: object
      properties:
        kind:
          type: string
          enum: [native, web]
        url:
          type: string
        externalId:
          type: ["string", "null"]
        fallbackUrl:
          type: string
      required: [kind, url, externalId]
    GuidedReplayQueueEntry:
      type: object
      properties:
        position:
          type: integer
        spinId:
          type: integer
        playedAt:
          type: string
        recordingMbid:
          type: ["string", "null"]
        title:
          type: string
        artist:
          type: string
        provenance:
          type: object
          properties:
            source:
              type: ["string", "null"]
            citation:
              type: ["string", "null"]
          required: [source, citation]
        target:
          anyOf:
            - $ref: "#/components/schemas/GuidedReplayQueueTarget"
            - type: "null"
        missingReason:
          type: ["string", "null"]
          enum: [not_mapped, dead_mapping, not_exact, unusable_mapping, null]
      required: [position, spinId, playedAt, recordingMbid, title, artist, provenance, target, missingReason]
    GuidedReplayQueueService:
      type: object
      properties:
        service:
          type: string
        label:
          type: string
        available:
          type: integer
        total:
          type: integer
      required: [service, label, available, total]
    GuidedReplayQueue:
      type: object
      properties:
        replayId:
          type: integer
        service:
          type: string
        serviceLabel:
          type: string
        services:
          type: array
          items:
            $ref: "#/components/schemas/GuidedReplayQueueService"
        coverage:
          type: object
          properties:
            total:
              type: integer
            available:
              type: integer
            missing:
              type: integer
          required: [total, available, missing]
        entries:
          type: array
          items:
            $ref: "#/components/schemas/GuidedReplayQueueEntry"
      required: [replayId, service, serviceLabel, services, coverage, entries]
    ReplayPlaylistTarget:
      type: object
      properties:
        service:
          type: string
          enum: [apple_music, tidal]
        displayName:
          type: string
        configured:
          type: boolean
        connected:
          type: boolean
        canWrite:
          type: boolean
        authRequired:
          type: boolean
      required: [service, displayName, configured, connected, canWrite, authRequired]
    ReplayPlaylistTargetsResponse:
      type: object
      properties:
        targets:
          type: array
          items:
            $ref: "#/components/schemas/ReplayPlaylistTarget"
      required: [targets]
    ReplayMaterializationRequest:
      type: object
      properties:
        service:
          type: string
          enum: [apple_music, tidal]
      required: [service]
    ReplayMaterializationReceipt:
      type: object
      properties:
        position:
          type: integer
        spinId:
          type: integer
        mbid:
          type: [string, "null"]
        title:
          type: string
        artist:
          type: string
        status:
          type: string
          enum: [accepted, missing, rejected]
        retryable:
          type: boolean
        error:
          type: string
      required: [position, spinId, mbid, title, artist, status, retryable]
    ReplayMaterializationJob:
      type: object
      properties:
        id:
          type: integer
        replayId:
          type: integer
        service:
          type: string
          enum: [apple_music, tidal]
        status:
          type: string
          enum: [pending, running, done, error]
        total:
          type: integer
        processed:
          type: integer
        accepted:
          type: integer
        missing:
          type: integer
        rejected:
          type: integer
        retryable:
          type: integer
        name:
          type: string
        description:
          type: string
        playlistId:
          type: [string, "null"]
        playlistUrl:
          type: [string, "null"]
        error:
          type: [string, "null"]
        errorRetryable:
          type: boolean
        finishedAt:
          type: [string, "null"]
        receipt:
          type: array
          items:
            $ref: "#/components/schemas/ReplayMaterializationReceipt"
      required: [id, replayId, service, status, total, processed, accepted, missing, rejected, retryable, name, description, playlistId, playlistUrl, error, errorRetryable, finishedAt, receipt]
    AppleMusicReplayMaterializationEntry:
      type: object
      properties:
        position:
          type: integer
        spinId:
          type: integer
        recordingMbid:
          type: ["string", "null"]
        rawArtist:
          type: string
        rawTitle:
          type: string
        title:
          type: string
        artist:
          type: string
        appleMusicId:
          type: ["string", "null"]
        url:
          type: ["string", "null"]
        status:
          type: string
          enum: [available, unavailable, unresolved, dead]
        reason:
          type: ["string", "null"]
          enum: [unavailable, unresolved, dead_link, dead, null]
      required: [position, spinId, recordingMbid, rawArtist, rawTitle, title, artist, appleMusicId, url, status, reason]
    AppleMusicReplayMaterialization:
      type: object
      properties:
        configured:
          type: boolean
        developerToken:
          type: ["string", "null"]
        appName:
          type: string
        apiBase:
          type: string
        storefront:
          type: string
          description: Public Apple Music storefront used by MusicKit JS (for example us).
        replayId:
          type: integer
        entries:
          type: array
          items:
            $ref: "#/components/schemas/AppleMusicReplayMaterializationEntry"
        coverage:
          type: object
          properties:
            total:
              type: integer
            available:
              type: integer
            unavailable:
              type: integer
            unresolved:
              type: integer
            dead:
              type: integer
          required: [total, available, unavailable, unresolved, dead]
      required: [configured, developerToken, appName, apiBase, storefront, replayId, entries, coverage]
    PickerRunSummary:
      type: object
      description: >-
        One documented picker run — all picks sharing one source URL (an NTS
        episode page, a list, a post), replayed in documented order.
      properties:
        runId:
          type: integer
        title:
          type: ["string", "null"]
          description: The run's own name (episode/list title), when known.
        sourceUrl:
          type: string
        pickedAt:
          type: ["string", "null"]
          description: When the picker documented this run (broadcast date).
        trackCount:
          type: integer
        resolvedCount:
          type: integer
          description: Picks resolved to the MBID spine (replayable tracks).
      required:
        - runId
        - sourceUrl
        - trackCount
        - resolvedCount
    PickerArchive:
      type: object
      properties:
        picker:
          $ref: "#/components/schemas/Picker"
        runs:
          type: array
          items:
            $ref: "#/components/schemas/PickerRunSummary"
      required:
        - picker
        - runs
    PickerRunDetail:
      type: object
      properties:
        picker:
          $ref: "#/components/schemas/Picker"
        run:
          $ref: "#/components/schemas/PickerRunSummary"
        tracks:
          type: array
          items:
            $ref: "#/components/schemas/ArchiveTrack"
      required:
        - picker
        - run
        - tracks
    GenreCount:
      type: object
      properties:
        genre:
          type: string
        count:
          type: integer
      required:
        - genre
        - count
    GenreBreakdown:
      type: object
      description: >-
        Ranked genre tags across a set of tracks. Genre data comes from
        MusicBrainz (primary) or Last.fm artist tags (fallback); tracks that
        were never enriched, or truly carry no tags, count toward
        `unknownCount` rather than being guessed at.
      properties:
        top:
          type: array
          items:
            $ref: "#/components/schemas/GenreCount"
        unknownCount:
          type: integer
        totalCount:
          type: integer
      required:
        - top
        - unknownCount
        - totalCount
    DiscoveryScore:
      type: object
      description: >-
        How "new music"-leaning a set of tracks is, based on each track's
        release year vs. the date it aired/was picked. Null fields mean there
        wasn't enough dated data to compute a score — never a fabricated
        guess.
      properties:
        medianAgeYears:
          type: ["number", "null"]
        score:
          type: ["number", "null"]
          description: 0-100, higher = newer / more discovery-leaning.
        label:
          type: string
          enum: [new-music, recent, catalog, unknown]
        sampleSize:
          type: integer
          description: Tracks with both a release year and an air/pick date.
        unknownCount:
          type: integer
          description: Tracks considered but missing a release year.
      required:
        - medianAgeYears
        - score
        - label
        - sampleSize
        - unknownCount
    GenreInsights:
      type: object
      description: Combined genre breakdown + discovery score for a scope (station, run, DJ, or list).
      properties:
        genreBreakdown:
          $ref: "#/components/schemas/GenreBreakdown"
        discoveryScore:
          $ref: "#/components/schemas/DiscoveryScore"
      required:
        - genreBreakdown
        - discoveryScore
    StationInsights:
      type: object
      properties:
        station:
          $ref: "#/components/schemas/StationRef"
        insights:
          $ref: "#/components/schemas/GenreInsights"
      required:
        - station
        - insights
    StationRunInsights:
      type: object
      properties:
        runId:
          type: integer
        insights:
          $ref: "#/components/schemas/GenreInsights"
