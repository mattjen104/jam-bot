        name:
          type: string
        found:
          type: ["integer", "null"]
        matched:
          type: ["integer", "null"]
        logged:
          type: integer
      required:
        - pickerId
        - handle
        - name
        - logged
    SpotifyStatus:
      type: object
      description: >
        Spotify Connect status for this browser session. When `configured` is
        false the feature is honestly absent (server has no app credentials).
      properties:
        configured:
          type: boolean
        connected:
          type: boolean
        displayName:
          type: ["string", "null"]
        product:
          type: ["string", "null"]
          description: Spotify product tier ("premium", "free", ...).
      required:
        - configured
        - connected
    SpotifyPlayRequest:
      type: object
      properties:
        mbid:
          type: string
          minLength: 1
        deviceId:
          type: ["string", "null"]
          description: >
            Target Spotify Connect device id (from the device picker). When
            provided, playback is directed to this device explicitly. When
            omitted or null, the active device is used (existing behaviour).
      required:
        - mbid
    SpotifyDevice:
      type: object
      description: >
        A Spotify Connect device visible to the listener's account.
        `type` follows Spotify's own taxonomy: Computer, Smartphone, Speaker,
        TV, etc. Restricted devices are never included in the list.
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
        isActive:
          type: boolean
      required:
        - id
        - name
        - type
        - isActive
    SpotifyDevicesResult:
      type: object
      description: Available Spotify Connect devices for this session.
      properties:
        devices:
          type: array
          items:
            $ref: "#/components/schemas/SpotifyDevice"
      required:
        - devices
    SpotifyPlayResult:
      type: object
      description: Full-track playback started on the listener's own device.
      properties:
        trackUri:
          type: string
        trackUrl:
          type: ["string", "null"]
        matchSource:
          type: string
          enum: [link, isrc, search]
          description: >
            How the MBID was matched to Spotify — exact stored link, ISRC
            lookup, or best-effort artist+title search (honest gradient).
        deviceName:
          type: ["string", "null"]
        durationMs:
          type: ["integer", "null"]
      required:
        - trackUri
        - matchSource
    SpotifySaveResult:
      type: object
      description: Liked Songs state for a resolved track.
      properties:
        saved:
          type: boolean
      required:
        - saved
    SpotifyPlayerState:
      type: object
      description: >
        Snapshot of the listener's Spotify player (Connect API). `active` is
        false when Spotify reports no playback session anywhere.
      properties:
        active:
          type: boolean
        isPlaying:
          type: boolean
        progressMs:
          type: ["integer", "null"]
        durationMs:
          type: ["integer", "null"]
        trackUri:
          type: ["string", "null"]
      required:
        - active
        - isPlaying
    SongExploderClaimRequest:
      type: object
      description: >
        Admin-entered, paraphrased claim attached to a Song Exploder episode's
        resolved recording. Never verbatim transcript — always a paraphrase with
        a deep link to the supporting moment in the episode.
      properties:
        offsetMs:
          type: ["integer", "null"]
          description: >
            Millisecond offset within the song where this fact applies.
            Null or omitted = track-level fact (shown in liner notes without
            a timeline anchor).
        text:
          type: string
          minLength: 1
          description: Paraphrased claim text (never verbatim transcript prose).
        sourceUrl:
          type: string
          minLength: 1
          description: >
            Deep link to the episode (or a timestamped link to the exact
            moment if the podcast player supports it), so every claim is
            one tap from its evidence.
      required:
        - text
        - sourceUrl
    SongExploderClaimResponse:
      type: object
      properties:
        claimId:
          type: integer
          description: The track_claims row id of the stored claim.
        mbid:
          type: string
          description: The MusicBrainz Recording ID the claim is attached to.
        episodeTitle:
          type: string
          description: The raw episode title from the Song Exploder feed.
      required:
        - claimId
        - mbid
        - episodeTitle
    SelectorSummary:
      type: object
      description: >
        One DJ selector with 30-day spin statistics. All active pickerType='dj'
        pickers appear here regardless of station affiliation.
      properties:
        id:
          type: integer
        name:
          type: string
        handle:
          type: string
        homeUrl:
          type: ["string", "null"]
        recentSpinCount:
          type: integer
          description: Number of spins in the past 30 days across all of this DJ's shows.
        lastPlayedAt:
          type: ["string", "null"]
          description: ISO-8601 timestamp of the most recent spin, or null if none in window.
        stationSlug:
          type: ["string", "null"]
          description: Station slug from the picker's sourceRef (e.g. "kexp"), or null if not station-affiliated.
        stationName:
          type: ["string", "null"]
          description: Human-readable station name (e.g. "KEXP"), or null if station not found.
        showName:
          type: ["string", "null"]
          description: Primary show name for this DJ at the station, or null if no shows are linked.
      required:
        - id
        - name
        - handle
        - homeUrl
        - recentSpinCount
        - lastPlayedAt
        - stationSlug
        - stationName
        - showName
    SelectorList:
      type: object
      description: The full list of active DJ selectors.
      properties:
        selectors:
          type: array
          items:
            $ref: "#/components/schemas/SelectorSummary"
      required:
        - selectors
    SelectorRunSummary:
      type: object
      description: >
        One run of a KEXP DJ selector — a single show × UTC broadcast day.
