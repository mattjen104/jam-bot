    ScrapedStation:
      type: object
      description: One station entry in the all-scraped-shows response.
      properties:
        slug:
          type: string
        name:
          type: string
        timezoneHint:
          type: ["string", "null"]
          description: >-
            Best-effort IANA timezone identifier inferred from the station's city
            and country (e.g. "America/Los_Angeles"). Null when the timezone
            cannot be confidently determined.
        shows:
          type: array
          items:
            $ref: "#/components/schemas/ScrapedShow"
      required: [slug, name, timezoneHint, shows]
    ScrapedStationList:
      type: object
      description: All stations with their scraped weekly programming grids.
      properties:
        stations:
          type: array
          items:
            $ref: "#/components/schemas/ScrapedStation"
      required: [stations]
    QualityTier:
      type: string
      enum: [proven, promising, raw, silent, unscored]
      description: >-
        Station ingest quality tier derived from the last 7 days of logged spins.
        "proven" = MBID resolution ≥40%; "promising" = track-shaped ≥50%;
        "raw" = metadata yield ≥20%; "silent" = active but near-zero usable
        metadata; "unscored" = fewer than 20 spins in the window.
    StationQualityScores:
      type: object
      description: Rolling quality metrics for a single station (last 7 days of spins).
      properties:
        metadataYield:
          type: ["number", "null"]
          description: Fraction of spins with non-null artist+title.
        trackShaped:
          type: ["number", "null"]
          description: Fraction of metadata spins that look like real "Artist – Title" pairs.
        mbidResolutionRate:
          type: ["number", "null"]
          description: Fraction of track-shaped spins that resolved to a MusicBrainz ID.
        musicShare:
          type: ["number", "null"]
          description: Fraction of spins NOT flagged by the ad-detection heuristic.
        sampleCount:
          type: integer
          description: Number of spins analysed.
        qualityTier:
          $ref: "#/components/schemas/QualityTier"
        computedAt:
          type: ["string", "null"]
          format: date-time
      required:
        - metadataYield
        - trackShaped
        - mbidResolutionRate
        - musicShare
        - sampleCount
        - qualityTier
        - computedAt
    AdminStationItem:
      type: object
      description: A station row with quality scores for the admin station list.
      properties:
        id:
          type: integer
        slug:
          type: string
        name:
          type: string
        org:
          type: ["string", "null"]
        country:
          type: ["string", "null"]
        active:
          type: boolean
        nowPlayingSource:
          type: ["string", "null"]
        tier:
          type: ["string", "null"]
        source:
          type: ["string", "null"]
        qualityTier:
          type: ["string", "null"]
          enum: ["proven", "promising", "raw", "silent", "unscored", null]
        metadataYield:
          type: ["number", "null"]
        trackShaped:
          type: ["number", "null"]
        mbidResolutionRate:
          type: ["number", "null"]
        musicShare:
          type: ["number", "null"]
        sampleCount:
          type: ["integer", "null"]
        qualityComputedAt:
          type: ["string", "null"]
          format: date-time
      required:
        - id
        - slug
        - name
        - org
        - country
        - active
        - nowPlayingSource
        - tier
        - source
        - qualityTier
        - metadataYield
        - trackShaped
        - mbidResolutionRate
        - musicShare
        - sampleCount
        - qualityComputedAt
    AdminStationListResponse:
      type: object
      properties:
        stations:
          type: array
          items:
            $ref: "#/components/schemas/AdminStationItem"
      required:
        - stations
    RecomputeQualityResponse:
      type: object
      description: >-
        Tier count summary returned after a quality recompute. Each property is
        the number of active stations assigned that quality tier.
      properties:
        proven:
          type: integer
        promising:
          type: integer
        raw:
          type: integer
        silent:
          type: integer
        unscored:
          type: integer
      required:
        - proven
        - promising
        - raw
        - silent
        - unscored
