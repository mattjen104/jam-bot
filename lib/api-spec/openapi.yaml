        - pickerType
        - trustTier
    SegueNextList:
      type: object
      properties:
        mbid:
          type: string
        next:
          type: array
          items:
            $ref: "#/components/schemas/SegueNext"
      required:
        - mbid
        - next
    IcecastReport:
