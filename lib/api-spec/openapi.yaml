        pickerHandle:
          type: string
        trustTier:
          type: integer
        mbid:
          type: ["string", "null"]
        artistMbid:
          type: ["string", "null"]
        context:
          type: ["string", "null"]
        sourceUrl:
          type: ["string", "null"]
        confidence:
          type: string
        pickedAt:
          type: ["string", "null"]
      required:
        - source
