      properties:
        runId:
          type: integer
          description: Opaque run identifier (min spin id for the group).
        date:
          type: ["string", "null"]
          description: UTC date of the broadcast (YYYY-MM-DD), null if unknown.
        show:
          type: ["object", "null"]
          description: The KEXP show metadata, null when show is unlinked.
          properties:
            name:
              type: ["string", "null"]
            djName:
              type: ["string", "null"]
        spinCount:
          type: integer
          description: Number of spins in this run.
        startedAt:
          type: ["string", "null"]
          description: ISO-8601 timestamp of the first spin in the run.
      required:
        - runId
        - date
        - show
        - spinCount
        - startedAt
    SelectorRunsResponse:
      type: object
      description: A KEXP DJ selector's full run history.
      properties:
        selector:
          type: object
          description: The selector this run history belongs to.
          properties:
            id:
              type: integer
            name:
              type: string
            handle:
              type: string
            homeUrl:
              type: ["string", "null"]
          required:
            - id
            - name
            - handle
            - homeUrl
        runs:
          type: array
          items:
            $ref: "#/components/schemas/SelectorRunSummary"
      required:
        - selector
